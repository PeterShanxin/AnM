[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anm"
version = "0.1.0"
description = "Windows-first desktop app to annotate and merge PDF files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AnM contributors" },
]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "tkinterdnd2>=0.4.1,<1",
  "pywebview>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0,<7",
  "pytest>=8.0,<9",
  "ruff>=0.11,<0.12",
]

[project.scripts]
anm = "anm.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anm.gui_web" = ["assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture=no"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
